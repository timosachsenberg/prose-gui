# TEMPORARY (the OpenMS re-pin's follow-up; removed before the merge): makes the parameter table and the reader's
# fixtures with the bundled ProSE of the new pin (the artifact prose-bundle-linux-x64 of a desktop.yml run) and commits
# them to this branch, since the session that made the pull request cannot download the artifact.
name: Regenerate fixtures (temporary)

on:
  push:
    branches: [claude/openms-develop-pin-followup]
    paths: [.github/workflows/regenerate-fixtures.yml]

permissions:
  contents: write
  actions: read

env:
  # the desktop.yml run whose artifact prose-bundle-linux-x64 holds the bundled ProSE of the pin
  BUNDLE_RUN: '41899484683'

jobs:
  regenerate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: The bundled ProSE of the pin
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download "$BUNDLE_RUN" --name prose-bundle-linux-x64 --dir "$RUNNER_TEMP/bundle"
          tar -C src-tauri/resources -xzf "$RUNNER_TEMP/bundle/prose-bundle.tar.gz"
          cat src-tauri/resources/prose/build.json
          src-tauri/resources/prose/bin/ProSE --help 2>&1 | grep -m1 'Version:'

      - name: OpenMS' TOPP test data of the fixtures, at the pin
        run: |
          pin=$(tr -d '[:space:]' < native/OPENMS_COMMIT)
          mkdir -p "$RUNNER_TEMP/topp/THIRDPARTY"
          for f in ProSE_empty.fasta SimpleSearchEngine_1.fasta SimpleSearchEngine_1.mzML \
            THIRDPARTY/DatabaseSuitability_database.fasta THIRDPARTY/DatabaseSuitability_in_spec.mzML; do
            curl -sfL "https://raw.githubusercontent.com/OpenMS/OpenMS/$pin/src/tests/topp/$f" -o "$RUNNER_TEMP/topp/$f"
          done

      - name: The parameter table, the fixtures, ProSE's --helphelp and the example's log
        env:
          PROSE: ${{ github.workspace }}/src-tauri/resources/prose/bin/ProSE
        run: |
          export OPENMS_TOPP="$RUNNER_TEMP/topp"
          node scripts/prose-parameters.mjs "$PROSE"
          for c in example suitability mods open empty no-decoys; do
            node scripts/results-fixture-native.mjs "$c" "$PROSE"
          done
          mkdir -p regen
          "$PROSE" --helphelp > regen/helphelp.txt 2>&1 || true
          # the example's search as the app runs it, its log kept (the PSM counts, the progress lines)
          KEEP=1 OUT="$RUNNER_TEMP/example" node scripts/results-fixture-native.mjs example "$PROSE" | tee regen/example-run.txt
          cp "$(grep -o 'kept .*' regen/example-run.txt | cut -d' ' -f2)/search/prose.log" regen/example-prose.log

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/lib/settings src/lib/results/fixtures regen
          git commit -m "Parameter table and reader fixtures of the bundled ProSE (regenerate-fixtures.yml, run $BUNDLE_RUN)"
          git push

# TEMPORARY (branch claude/compare-defaults, not for main): what archive.openms.de has (a larger dataset for the
# comparison of the tool's defaults with the web app's settings).
name: Compare defaults (temporary)

on:
  push:
    branches: [claude/compare-defaults]

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-22.04
    steps:
      - name: The archive's listing, three levels
        run: |
          list() { curl -sfL --max-time 30 "$1" | grep -oE 'href="[^"?#]+"' | cut -d'"' -f2 | grep -vE '^(/|\.\./|https?:)' || true; }
          base=https://archive.openms.de/
          curl -sfIL --max-time 30 "$base" | head -5 || true
          for a in $(list "$base"); do
            echo "$a"
            case "$a" in */) ;; *) continue ;; esac
            for b in $(list "$base$a"); do
              echo "  $a$b"
              case "$b" in */) ;; *) continue ;; esac
              for c in $(list "$base$a$b" | head -60); do echo "    $a$b$c"; done
            done
          done
      - name: The archive's index pages with sizes (top two levels)
        run: |
          curl -sfL --max-time 30 https://archive.openms.de/ | sed -e 's/<[^>]*>/ /g' | tr -s ' ' | grep -v '^ *$' | head -80 || true

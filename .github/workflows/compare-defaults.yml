# TEMPORARY (branch claude/compare-defaults, not for main): what archive.openms.de has (a larger dataset for the
# comparison of the tool's defaults with the web app's settings).
name: Compare defaults (temporary)

on:
  push:
    branches: [claude/compare-defaults]

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-22.04
    steps:
      - name: The candidate folders with sizes, two levels
        run: |
          base=https://archive.openms.de/openms/
          page() { echo "## $1"; curl -sfL --max-time 30 "$base$1" | sed -e 's/<[^>]*>/ /g' | tr -s ' ' | grep -vE '^ *$|Index of|\.\./' | head -80 || true; }
          sub() { curl -sfL --max-time 30 "$base$1" | grep -oE 'href="[^"?#]+/"' | cut -d'"' -f2 | grep -vE '^(/|\.\./|https?:)' || true; }
          for d in testfiles/proteobench-astral-entrapment/ testfiles/lfq/ testfiles/20260717-ProteomicsLFQ-Multi-Instrument/ benchmarks/pride-benchmarks/ testfiles/raw-file-museum/; do
            page "$d"
            for s in $(sub "$d"); do page "$d$s"; done
          done
